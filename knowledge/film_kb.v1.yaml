# FilmLook-ML film knowledge base, v1 (compiled 2026-11-07).
#
# Evidence layers are kept apart. Do not mix them:
#   measured:            numbers published by the manufacturer, with the metric, its scale and its conditions.
#                        Metrics are NOT interchangeable: Kodak's Print Grain Index (PGI) and diffuse RMS granularity
#                        use different scales and cannot be compared with each other; Kodak says so explicitly.
#   manufacturer_claims: the manufacturer's own descriptive statements, paraphrased (marketing language, not measurements).
#   database_subjective: FilmLook database entries: the i50mm 1-5 ratings and the app's "character" text. These are
#                        subjective opinions or editorial text.
#   simulation:          OUR approximate parameter ranges for film-synth (engine scale 0-1). They are derived from the
#                        layers above by the rules in `simulation_rules`. They are not physical measurements, and no
#                        preset reproduces a proprietary emulsion.
# Appearance also depends on exposure, development, scanning, printing and post-processing. Every entry is a
# tendency, not a fixed look.
version: film-kb-v1
sources:
  kodak_e4050: {title: "KODAK PROFESSIONAL PORTRA 400 Film, E-4050", dates: ["2016-02", "2025-01"], url: "https://kodakprofessional.com/sites/default/files/wysiwyg/pro/resources/e4050_portra_400.pdf", kind: manufacturer_datasheet}
  kodak_e4051: {title: "KODAK PROFESSIONAL PORTRA 160 Film, E-4051", dates: ["2016-02"], url: "https://125px.com/docs/film/kodak/e4051_Portra_160-2016.pdf", kind: manufacturer_datasheet (unofficial mirror)}
  kodak_e4040: {title: "KODAK PROFESSIONAL PORTRA 800 Film, E-4040", dates: ["2016-02"], url: "https://125px.com/docs/film/kodak/e4040_portra_800-2016.pdf", kind: manufacturer_datasheet (unofficial mirror)}
  kodak_e4046: {title: "KODAK PROFESSIONAL EKTAR 100 Film, E-4046", dates: ["2016-02"], url: "https://125px.com/docs/film/kodak/e4046_ektar_100-2016.pdf", kind: manufacturer_datasheet (unofficial mirror)}
  kodak_e7022: {title: "KODAK GOLD 200 Film, E-7022", dates: ["2016-02"], url: "https://125px.com/docs/film/kodak/E7022_Gold_200-2016.pdf", kind: manufacturer_datasheet (unofficial mirror)}
  kodak_f4017: {title: "KODAK PROFESSIONAL TRI-X 320 and 400 Films, F-4017", dates: ["2002-09", "2016-12", "2021-10"], url: "https://kodakprofessional.com/sites/default/files/wysiwyg/film/f4017_trix_320400.pdf", kind: manufacturer_datasheet}
  kodak_f4016: {title: "KODAK PROFESSIONAL T-MAX 100 Film, F-4016", dates: ["2002-01", "2018-06"], url: "https://125px.com/docs/film/kodak/f4016_tmax_100-2018.pdf", kind: manufacturer_datasheet (unofficial mirror)}
  kodak_f4043: {title: "KODAK PROFESSIONAL T-MAX 400 Film, F-4043", dates: ["2016-02"], url: "https://125px.com/docs/film/kodak/f4043_TMax_400-2016.pdf", kind: manufacturer_datasheet (unofficial mirror)}
  fuji_af3_207u: {title: "FUJIFILM Professional Data Guide AF3-207U", dates: ["2005"], url: "https://asset.fujifilm.com/www/ca/files/2020-04/9cdee030ab7fc76bbcfddbcd38650038/ProfessionalFilmDataGuide.pdf", kind: manufacturer_guide}
  fuji_rvp100f: {title: "FUJICHROME Velvia 100F Professional data sheet", url: "https://www.freestylephoto.com/static/pdf/product_pdfs/fujifilm/Velvia100F_Data.pdf", kind: manufacturer_datasheet (retailer-hosted)}
  ilford_hp5_fp4: {title: "ILFORD HP5 PLUS / FP4 PLUS technical information", url: "https://www.ilfordphoto.com/film-technical-downloads/", kind: manufacturer_datasheet, status: "NOT READ: HTTP 403 for automated access on 2026-11-07"}
  filmlook_db: {title: "FilmLook evaluation database (taxonomy-db-v1, i50mm ratings, app character text)", kind: subjective_editorial}

simulation_rules:
  grain: >-
    Within one metric family only. Colour negatives are ranked by 35 mm PGI at 8x10 in. Slide and B&W films are ranked
    by diffuse RMS. Engine grain_strength = 0.05 + 0.45 * (value - family_min) / (family_max - family_min), +/- 0.05.
    Families are not compared across metrics.
  colour_and_tone: >-
    Manufacturer claims of "high"/"ultra-high saturation" or "high contrast" map to the upper third of the engine's
    saturation/contrast range, "medium" to the middle third, and "natural/neutral skin tones" to the lower-middle
    third of saturation. These are qualitative mappings with confidence: low.
  latitude: "Stated exposure latitude sets the exposure_ev nuisance range for that preset. Recorded, not simulated physically."

films:
  - id: kodak_ektar_100
    name: Kodak Ektar 100
    manufacturer: Kodak (Kodak Alaris)
    iso: 100
    type: color_negative
    process: C-41
    measured:
      print_grain_index_35mm: {"4x6": "<25", "8x10": 38, "16x20": 66, source: kodak_e4046, note: "PGI 25 = approximate visual threshold of graininess"}
    manufacturer_claims: ["world's finest-grain colour negative (manufacturer claim)", "high saturation and ultra-vivid colour", "optimised sharpness"]
    database_subjective: {aesthetic_id: ektar_like, character: "vivid, fine-grained colour negative; saturated reds and blues"}
    simulation: {family_hint: vivid_negative, grain_strength: [0.0, 0.1], saturation_adjustment: [0.3, 0.6], contrast_adjustment: [0.1, 0.35], confidence: low}
    evidence_quality: "high (measured grain), medium (claims)"
    uncertainties: ["no published colour-response or characteristic-curve numbers extracted", "scan and print change the saturation strongly"]
