- id: E50_aesthetic_vs_content
  hypothesis: 'the student''s pooled PCA-64 neighbourhoods are rendering neighbourhoods, not scene neighbourhoods: on the
    commoncatalog_film analysis half (uploader excluded), for each of the three E43 seeds the five nearest neighbours differ
    from the query in the standardised colour-tone statistics by at most 0.8x, and in the texture statistics by at most 0.9x,
    what five random candidates do, and the uploader-grouped ridge R^2 of the embedding from the 28 explicit rendering statistics
    is at least its R^2 from a dimension-matched 28-d PCA of the frozen DINOv2 CLS++mean content embedding'
  motivation: the product promise is "similar look"; a representation whose neighbours merely share a scene (or a scanner)
    would mislead badge recommendations and style exploration. The explicit statistics are the deterministic attribute set
    the product already shows, so neighbour coherence in them is the closest label-free proxy for a shared look. Content and
    provenance R^2 are read alongside; the museum half repeats the reading on a second domain.
