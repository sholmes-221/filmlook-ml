- id: E51_source_vicreg
  hypothesis: 'the rank/content trade-off of E46 can be broken by expanding treatment variance only: a VICReg term on the
    pooled layer computed on features centred on their synthetic source''s in-batch mean (--vic-mode source, batches led by
    12 sources x 4 rows, --kd 0, weight 1) gives, for each of three seeds, a PCA-64 with effective rank >= 8, own-source rank-1
    <= 0.45, museum p@5 lower CI above chance, within-uploader different-day AUC lower CI above 0.5 and synthetic family p@5
    within 0.10 of the E43 reference seed-mean, with the seed-mean museum p@5 not more than 0.02 below the plain no-teacher
    seed-mean'
  motivation: 'E46 raised the rank to 22 and the real metrics (museum 0.52, within AUC 0.66) but own-source rank-1 rose from
    0.28 to 0.61: the batch-wise variance term expands between-photograph (content) directions as readily as treatment directions.
    Centring on the source removes the content component from the regulariser; if the rank still rises without content, the
    pooled layer gets a teacher-free rank control; if not, rank and content are not separable in this architecture either.'
  value: 5
  gpu_minutes: 5
  gpu_mb: 6000
  cpu_minutes: 10
  disk_gb: 0.02
  datasets:
  - film_synth_v2
  - commoncatalog_ccby
