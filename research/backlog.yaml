    crop, flip, JPEG q50 and rescale, edit-type p@5 is within 0.03 of the E49 reference seed-mean (>= 0.436), an edited image
    retrieves its original at most half the time, and on the analysis halves the PCA-64 keeps effective rank >= 8, own-source
    rank-1 <= 0.45, museum p@5 lower CI above chance and within-uploader different-day AUC lower CI above 0.5'
  motivation: 'E49 measured the one product-relevant weakness of the candidate: JPEG q50 and 0.5x rescale lose the nearest
