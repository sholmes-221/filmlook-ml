experiments:
- id: E8_zimage_third_generator
  hypothesis: grain-randomised synthetic training generalises to an unseen diffusion family (Z-Image-Turbo), not only to SDXL
  motivation: v3 C3 showed 0.58 fs->sdxl but 0.48 sdxl->fs; a third family separates "learned film treatment" from "learned
    SDXL"
  value: 5
  gpu_minutes: 40
  disk_gb: 0.2
  datasets:
  - film_synth_v2
  - sdxl_i2i_v1
  - zimage_i2i_v1
  - blueneg
  - commoncatalog
  metric: held-out-Z-Image treated AUROC (train filmsynth+SDXL) with source bootstrap CI; 4-way generator identity; BlueNeg
    AUROC; same-stock p@5
  confounders:
  - Z-Image VAE signature
  - content drift at strength 0.35
  - shared sources across generators
  falsified_if: held-out Z-Image AUROC CI includes 0.5
  stop: one run at 100 sources; scale to 500 only if the CI excludes 0.5 and generator-ID does not rise
  status: pending
- id: E9_layer_ablation
  hypothesis: transferable style lives in specific DINOv2 layers; layers 4/8 were an untested guess
  motivation: cheap, informs every later architecture choice (student distillation target)
  value: 4
  gpu_minutes: 8
  cpu_minutes: 10
  disk_gb: 0
  metric: per-layer (mean++std of patch tokens) held-out-generator AUROC and BlueNeg same-stock p@5
  confounders:
  - dimensionality differences
  - probe capacity
  falsified_if: no layer beats the 4/8 pair by more than the CI width
  status: superseded
  result: superseded by E26_layer_statistic_ablation (benchmark v1 metrics, adds Gram statistics)
- id: E10_sdxl_strength_050
  hypothesis: the weak reverse direction (sdxl->filmsynth 0.48) is because strength-0.35 treatments barely change rendering
  motivation: 'E19 diagnostic: SDXL treatments at 0.35 differ by 0.19x nuisance; labels meaningless'
  value: 5
  gpu_minutes: 8
  disk_gb: 0.1
  metric: pairwise LOGO both directions at strength 0.5 vs 0.35; content own-source rank-1 (must stay > 0.9)
  confounders:
  - content drift at higher strength
  falsified_if: sdxl->filmsynth AUROC does not rise above 0.55 or rank-1 drops below 0.9
  status: rejected
  result: per-image change up, no shared treatment signature; content preservation 0.97->0.82
- id: E11_parameter_similarity_supcon
  hypothesis: a style embedding trained with continuous parameter-vector similarity (across sources and generators) retrieves
    same-stock real scans better than family-label SupCon
  motivation: product goal is cross-photo style similarity, not family classification
  value: 4
  gpu_minutes: 5
  cpu_minutes: 10
  disk_gb: 0
  metric: BlueNeg same-stock p@5 (chance 0.12) and cross-generator treated retrieval
  confounders:
  - parameters undefined for diffusion outputs; only filmsynth carries them
  falsified_if: same-stock p@5 does not exceed 0.25 (family SupCon) by more than 0.03
  status: pending
- id: E12_spatial_student
  hypothesis: a MobileNetV3 student with a 2x2 feature-map grid head recovers framing offsets as well as the DINOv2 grid probe
    (R^2 ~0.23)
  value: 3
  gpu_minutes: 10
  disk_gb: 0
  metric: crop offset R^2 on held-out sources; mirror sensitivity
  falsified_if: R^2 < 0.1
  status: pending
  blocked_by: null
- id: E13_scale_500_sources
  hypothesis: scaling v2-style synthesis to 500 sources improves cross-generator and real-film metrics
  value: 3
  gpu_minutes: 60
  disk_gb: 2
  metric: v4 benchmark at 500 sources vs 100
  falsified_if: no CI-separated gain on held-out generator AUROC or same-stock p@5
  status: deferred
  blocked_by: E8_zimage_third_generator
  reason: 'E8: held-out Z-Image CI excludes 0.5 but generator identifiability unchanged and real-film unimproved; also ~2.5
    GPU-h of Z-Image generation'
  motivation: 'E8 + E10: more synthesis of the same kinds improves nothing real'
- id: E16_texture_neutral_dino
  hypothesis: DINOv2 features of texture-neutralised images (downsampled before encoding) transfer across generator types
    in both directions and keep same-stock retrieval, because the inversion came from texture entanglement
  motivation: 'E15: colour/tone alone transfers (0.74/0.71) but is 16-d; DINOv2 carries layout and colour relations but also
    generator texture'
  value: 5
  gpu_minutes: 6
  disk_gb: 0
  metric: 6 pairwise LOGO AUROCs with CIs; BlueNeg same-stock SupCon p@5 with CI; BlueNeg-vs-digital (expected near chance)
  confounders:
  - downsampling also removes fine composition cues
  - colour shifts from resampling
  falsified_if: either cross-type direction stays below 0.6 or same-stock p@5 falls below the colour/tone-only 0.19
  status: pending
- id: E17_colour_rendition_descriptor
  hypothesis: a richer global, explainable colour-rendition descriptor (per-channel tone percentiles, chroma and cast by luminance
    band, hue histogram, channel correlations) transfers across generator types at least as well as the 16-d set and lifts
    real-scan same-stock retrieval above 0.19
  motivation: 'E15/E16: global low-dimensional colour/tone statistics transfer; deep features do not'
  value: 5
  gpu_minutes: 0
  cpu_minutes: 5
  disk_gb: 0
  metric: 6 pairwise LOGO with CIs (cross-type mean), BlueNeg same-stock raw/SupCon with roll CI, BlueNeg-vs-digital (expected
    near chance)
  confounders:
  - more dimensions with 700 training rows can overfit generator-specific hues
  falsified_if: cross-type mean < 0.635 or same-stock SupCon <= 0.19
  status: pending
- id: E18_minimal_transferable_statistics
  hypothesis: a subset of the 16 coarse colour/tone statistics carries all of the cross-type transfer; the rest add scene
    identity
  value: 4
  gpu_minutes: 0
  cpu_minutes: 3
  disk_gb: 0
  metric: leave-one-out and greedy forward selection on cross-type mean AUROC (4 cross-type pairs) with source CIs; same-stock
    p@5 of the chosen set
  falsified_if: no subset of <= 8 statistics reaches the full set's cross-type mean within 0.02
  status: pending
- id: E19_content_invariant_projection
  hypothesis: all-generator labels + hard negatives + content decorrelation improve cross-scene retrieval without generator
    fingerprint
  value: 4
  gpu_minutes: 1
  disk_gb: 0
  metric: 'benchmark v1 val: B, C share, E'
  falsified_if: C share or E subject probe rises
  status: rejected
- id: E20_second_real_film_source
  hypothesis: a second rights-cleared real-film source with stock records (different photographer, scanner, era) narrows the
    same-stock CI and tests whether 0.25 holds beyond BlueNeg
  value: 5
  gpu_minutes: 10
  disk_gb: 2
  metric: same-stock p@5 with roll CI on the new source; cross-source retrieval
  falsified_if: hybrid SupCon not above DINOv2 reference on the new source
  status: in_progress
  blocker: no rights-cleared source found yet (docs/FILM_DATASET_RESEARCH.md); needs owner decision on the app's self-reported
    stock flow
  result: Wikimedia Commons film-stock categories identified; acquisition running in the data pipeline (rate-limited; resumable)
- id: E21_abstention_threshold_shadow
  hypothesis: the top1_sim 50%-coverage threshold from benchmark v1 holds its precision on shadow-mode traffic (hash-only
    logging) once a privacy review allows it
  value: 3
  gpu_minutes: 0
  disk_gb: 0
  metric: coverage at the fixed threshold on shadow records
  falsified_if: coverage < 20% or > 80% on real traffic
  status: blocked
  blocker: privacy and retention review before any user-photo logging
- id: E22_student_teacher_agreement
  hypothesis: 'student_fs_v2 fails on real scans because it never saw real inputs: agreement with its teacher is high on filmsynth
    and low on real photographs'
  value: 4
  gpu_minutes: 0
  cpu_minutes: 3
  status: supported
  result: neighbour Jaccard 0.35 synthetic vs 0.04-0.05 real; Spearman 0.62 vs 0.35-0.48 (session 3)
- id: E23_real_image_distillation
  hypothesis: adding real photographs as KD-only inputs closes the student-teacher gap on real scans without hurting synthetic
    metrics
  value: 5
  gpu_minutes: 25
  status: supported
  result: 'E23b real-distil: held-out CC Spearman 0.53->0.62, BlueNeg-corrupted 0.38->0.47, val B fs 0.557 vs 0.520; E23c
    SDXL-input control rejected (CC 0.55, BlueNeg 0.32)'
- id: E24_scanner_effects
  hypothesis: style embeddings of real scans recover the lab scanner (Noritsu / Frontier / flatbed) rather than the film
  value: 4
  gpu_minutes: 0
  cpu_minutes: 2
  status: rejected
  result: scanner probe ~ majority (0.51) for all style embeddings; colour_tone16 0.59; same-scanner share ~ prior; uploader
    share 0.02-0.05 vs prior 0.007
- id: E25_linear_content_residualisation
  hypothesis: ridge-residualising the hybrid features on DINOv2-global content before the SupCon projection removes content
    and keeps treatment
  value: 3
  gpu_minutes: 2
  status: rejected
  result: 'destroys style: B 0.12-0.26, rank-1 0.57-0.69; random-projection control B 0.40. DINOv2-global is not a content-only
    vector. Do not repeat unchanged.'
- id: E26_layer_statistic_ablation
  hypothesis: a (DINOv2 layer, patch statistic) choice exists that keeps L4+L8 mean/std treatment sensitivity, retrieves real
    same-stock scans at least as well and leaks less content; second-order (Gram) statistics of early layers are the classic
    style carrier
  motivation: E9 was never run; the distillation target for every student is this guess. E25 showed subtraction of content
    fails; selection of statistics is the untested alternative
  value: 5
  gpu_minutes: 8
  gpu_mb: 5000
  cpu_minutes: 6
  disk_gb: 0.25
  datasets:
  - bench_features_v1
  metric: 'per-(layer,statistic) family-SupCon candidates: val B filmsynth p@5 (CI), E own-source rank-1, E subject probe,
    BlueNeg blue-corrupted same-stock p@5 (roll CI). Analysis data only.'
  confounders:
  - dimensionality differences between mean/std (768) and gram32 (528)
  - SupCon capacity fixed at 64-d
  - BlueNeg-corrupted is dominated by one stock (218/297 Kodak Gold 100-5)
  falsified_if: 'no candidate satisfies all three pre-registered conditions: real same-stock lower CI above the baseline point
    estimate, val B fs not below the baseline lower CI, own-source rank-1 not worse by more than 0.05'
  falsify:
    metric: beats
    below: 0.5
  falsify_sufficient: true
  command:
  - /home/shanmo/misc/filmlook-ml/.venv/bin/python
  - scripts/layer_stat_ablation.py
  result_json: reports/layer_stat_ablation.json
  watched_paths:
  - data/embeddings/bench_layers_v1.npz
  metrics_of_interest:
    beats:
      path: summary.beats
      kind: proxy
    best_real_same_stock:
      path: summary.best_real.blueneg_corrupted_same_stock
      kind: real
    baseline_real_same_stock:
      path: summary.baseline.blueneg_corrupted_same_stock
      kind: real
    best_real_val_B:
      path: summary.best_real.val_B_filmsynth
      kind: synthetic
    best_real_rank1:
      path: summary.best_real.val_E_rank1
      kind: proxy
      higher_is_better: false
  next_step: 'if supported: retrain the real-distil student (E23b recipe) on the winning target and evaluate on CommonCatalog
    film scans; if rejected: keep L4+L8 mean/std and move to augmentation-based invariance (E27)'
  status: rejected
  result: 'rejected under the pre-registered rule: no candidate''s BlueNeg-corrupted CI clears the baseline because that partition
    is at chance (0.565, one stock = 73%). Synthetic side: L3 mean/std B 0.572 [0.538,0.603] vs 0.467 [0.418,0.514], rank-1
    0.262 vs 0.369; L2-L4 ms >= baseline; gram32 worse everywhere; L9+ content-heavy. -> E27'
- id: E27_early_layer_teacher
  hypothesis: a hybrid teacher built on early-layer mean/std (L3, or L2-L4 concatenated) instead of L4+L8 retrieves same-stock
    real film at least as well as the current teacher on an informative real source, with lower photographer leakage, and
    a student distilled from it with the E23b recipe inherits the gain
  motivation: 'E26: L3 mean/std is CI-separated better on cross-scene treatment retrieval with less content leakage; the real-film
    check used there was uninformative. Must be judged on real film before any target change.'
  value: 5
  gpu_minutes: 4
  gpu_mb: 5000
  cpu_minutes: 10
  disk_gb: 0.05
  datasets:
  - commons_film
  metric: 'Commons analysis half (research.eval_pipeline rules): same-stock p@5 uploader-excluded with CI, uploader share
    excess, scanner probe; plus val benchmark B/E and CommonCatalog film-scan uploader share (scripts/scanner_effects.py)'
  confounders:
  - Commons stock labels are uploader claims
  - early layers may encode scanner/JPEG texture rather than film
  - student capacity (MobileNetV3) may not fit the new target
  falsified_if: on the Commons analysis half the L3 teacher's same-stock p@5 is not >= the L4+L8 teacher's lower CI, or its
    uploader-share excess exceeds the baseline's by > 0.02
  needs: 'done: scripts/train_style_student.py --teacher-layers, research/candidates_e27.py, checkpoint student_style_l3_real;
    waiting on dataset:commons_film'
  next_step: 'if supported: switch the distillation target and re-run the full benchmark on a fresh test set (v1 test is spent);
    if rejected: keep L4+L8 and move to augmentation-based invariance'
  status: deferred
  result: 'deferred: Commons remains throttled; E27b answered the same question on commoncatalog_film twice (inconclusive,
    no gain); L3 target closed without adoption'
- id: E27a_student_l3_teacher_interim
  hypothesis: a real-distil student (E23b recipe) distilled from a layer-3 mean/std hybrid teacher keeps the synthetic family
    signal and content invariance of the L4+L8 real-distil student (interim, synthetic/proxy only; the real-film decision
    is E27 on Commons)
  motivation: 'E26: L3 mean/std beats L4+L8 on cross-scene treatment retrieval with less content leakage; produces the checkpoint
    the evaluation pipeline will score when commons_film is ready'
  value: 4
  gpu_minutes: 2
  gpu_mb: 4000
  cpu_minutes: 2
  disk_gb: 0.01
  datasets:
  - film_synth_v2
  - commoncatalog_ccby
  metric: 'student report: family macro-F1 (synthetic test), own-source rank-1 of the 64-d head (content invariance test);
    compared with E23b under the evaluator rules (proxies only: no promotion possible from this run)'
  confounders:
  - student capacity
  - teacher SupCon seed
  falsified_if: fam_f1 below E23b's by more than 0.05 or rank1_kd64 above E23b's by more than 0.05 (interim; recorded, no
    real-film claim)
  falsify:
    metric: rank1_kd64
    above: 0.231
  command:
  - /home/shanmo/misc/filmlook-ml/.venv/bin/python
  - scripts/train_style_student.py
  - --synth
  - film_synth_v2
  - --train-generators
  - filmsynth
  - --no-blueneg-eval
  - --real-distil
  - --teacher-layers
  - '3'
  - --tag
  - style_l3_real
  result_json: reports/student_style_l3_real.json
  baseline_id: E23b_student_real_distil
  watched_paths:
  - checkpoints/student_style_l3_real
  metrics_of_interest:
    rank1_kd64:
      path: content_invariance_test.own_source_rank1_kd64
      kind: proxy
      higher_is_better: false
    fam_f1:
      path: synthetic_test.family_macro_f1
      kind: proxy
    treated_auroc:
      path: synthetic_test.treated_auroc_filmsynth
      kind: synthetic
  next_step: checkpoint student_style_l3_real becomes an eligible candidate of research.eval_pipeline; E27 decides on the
    Commons analysis half
  status: inconclusive
  result: 'inconclusive (interim): student fam F1 0.616 vs 0.650, rank-1 0.21 vs 0.18 (within thresholds); teacher val B 0.572
    vs 0.467, rank-1 0.262 vs 0.369, generator share 0.594 vs 0.541. Checkpoint student_style_l3_real awaits the Commons evaluation
    (E27).'
- id: E28_l3_shortcut_audit
  hypothesis: 'the layer-3 teacher''s cross-scene treatment gain (E26/E27) is not a filmsynth-pipeline shortcut and the L3
    features do not recover scanner family or uploader on real film scans more than L4+L8: under a generator-swapped SupCon
    projection (trained on sdxl families) the L3 advantage on held-out filmsynth persists, and on CommonCatalog film-scan
    originals (train+val) the L3 teacher''s scanner-probe accuracy is within +0.05 and its same-uploader top-5 share within
    +0.02 of the L4+L8 teacher'
  motivation: E27 (real film, Commons) is blocked by rate limiting; E27 val showed the L3 gain only on filmsynth (not sdxl/zimage)
    and a higher generator share, which is the signature of a pipeline fingerprint; early layers may encode scanner/JPEG texture.
    All three checks run on cached features and analysis data only.
  value: 4
  gpu_minutes: 1
  gpu_mb: 2500
  cpu_minutes: 5
  disk_gb: 0.01
  datasets:
  - bench_features_v1
  - commoncatalog_ccby
  metric: 'scripts/l3_shortcut_audit.py: swap_status (persists|inconclusive|vanishes), scanner probe accuracy and same-uploader
    share on 265 real scans (138 uploaders), summary.passes'
  confounders:
  - sdxl TRAIN has only 4 families / 280 rows, so swapped projections are weaker for both candidates (CI-based rule)
  - scanner family from EXIF camera is a proxy
  - students compared as observations only
  falsified_if: 'summary.passes == 0: the L3 advantage vanishes under the generator swap (L3 point estimate <= baseline upper
    CI on filmsynth val), or scanner probe accuracy exceeds the baseline''s by > 0.05, or same-uploader share exceeds the
    baseline''s by > 0.02'
  falsify:
    metric: passes
    below: 1
  falsify_sufficient: false
  command:
  - /home/shanmo/misc/filmlook-ml/.venv/bin/python
  - scripts/l3_shortcut_audit.py
  result_json: reports/l3_shortcut_audit.json
  metrics_of_interest:
    passes:
      path: summary.passes
      kind: proxy
    swap_gain:
      path: summary.swap_L3_minus_baseline_filmsynth_val
      kind: synthetic
    scanner_excess:
      path: summary.scanner_acc_L3_minus_baseline
      kind: proxy
      higher_is_better: false
    uploader_excess:
      path: summary.uploader_share_L3_minus_baseline
      kind: proxy
      higher_is_better: false
  next_step: 'not falsified: L3 stays a candidate for E27 on Commons (no promotion from this run); falsified: drop the L3
    teacher target, keep L4+L8, record which shortcut'
  status: rejected
  result: 'falsified: passes=0.0000 < 1'
- id: E27b_early_layer_teacher_commoncatalog
  hypothesis: a hybrid teacher built on early-layer mean/std (L3, or L2-L4 concatenated) instead of L4+L8 retrieves same-stock
    real film at least as well as the current teacher on an informative real source, with lower photographer leakage, and
    a student distilled from it with the E23b recipe inherits the gain (same hypothesis, judged on the CommonCatalog film-scan
    set with uploader stock tags instead of Commons)
  motivation: Commons acquisition is throttled; commoncatalog_film is an independent real-film source (class B, uploaders
    disjoint from training). Rules copied verbatim from E27 before any commoncatalog_film result is read (2026-11-07 23:40).
  value: 5
  gpu_minutes: 4
  gpu_mb: 5000
  cpu_minutes: 10
  disk_gb: 0.05
  datasets:
  - commoncatalog_film
  metric: 'commoncatalog_film analysis half (research.eval_pipeline rules): same-stock p@5 uploader-excluded with CI, uploader
    share excess, scanner probe; candidate hybrid_l3_supcon_family vs hybrid_supcon_family, plus student_style_l3_real vs
    student_style_fs_v2_real'
  confounders:
  - stock labels are uploader tags (noisy)
  - several stocks are held by few uploaders
  - scanner EXIF families are coarse
  falsified_if: on the commoncatalog_film analysis half the L3 teacher's same-stock p@5 is not >= the L4+L8 teacher's lower
    CI, or its uploader-share excess exceeds the baseline's by > 0.02
  needs: dataset:commoncatalog_film ready (>= 300 rows); the evaluation task eval_commoncatalog_film_analysis runs automatically
  next_step: 'if supported on this set AND not rejected on any other real-film set: switch the distillation target and re-run
    the full benchmark on a fresh test set; if rejected: keep L4+L8'
  status: inconclusive
  result: 'inconclusive: on the commoncatalog_film analysis half (247 scans, 87 uploaders, snapshot 28d45d1d) the L3 teacher''s
    same-stock p@5 is 0.137 [0.105, 0.176] vs L4+L8 0.146 [0.119, 0.184] (chance 0.125): not below the baseline''s lower CI
    and uploader-share excess -0.001, so not falsified, but no gain; every candidate including the baseline is at chance on
    the pre-registered speed-level stock labels, so this snapshot cannot rank teachers. Student l3_real 0.152 vs fs_v2_real
    0.143: same. SECOND SNAPSHOT: inconclusive on the second snapshot too (905 scans, 252 uploaders, 88 stocks; analysis half
    445/124, 356 queries from 112 uploaders): L3 teacher same-stock p@5 0.055 [0.042, 0.071] vs L4+L8 0.051 [0.036, 0.069],
    chance 0.044; uploader-share excess +0.009. Every candidate is within CI of chance on the pre-registered metric; on the
    secondary stock-line metric the baseline is 0.078 [0.065, 0.091] vs chance 0.066, student_style_fs 0.101 [0.087, 0.118],
    student_style_l3_real 0.066 (chance). The L3 target brings no real-film gain on two snapshots and its student is the weakest
    on the line metric: the L3 line of work is closed without adoption.'
- id: E29_curated_cross_source_robustness
  hypothesis: on CC0 museum photographs (aic_photographs, analysis half) the style embeddings retrieve the physical print
    process (owner records) above chance with the artist excluded, without photographer leakage; the real-distil student agrees
    with its teacher on this third real domain
  motivation: cross-source robustness check on a domain that is neither Flickr scans nor synthetic renders; CC0 permits later
    use as distillation inputs if useful
  value: 3
  gpu_minutes: 3
  gpu_mb: 3000
  cpu_minutes: 5
  disk_gb: 0.02
  datasets:
  - aic_photographs
  metric: process p@5 artist-excluded (chance = class prior) with artist bootstrap CI; artist-share top-5 vs prior; student-teacher
    Spearman
  confounders:
  - process correlates with decade and subject
  - museum digitisation is a shared nuisance
  - historic prints only
  falsified_if: a candidate's artist-share excess over hybrid_supcon_family exceeds 0.02, or its process p@5 lower CI is below
    chance
  needs: done
  next_step: 'if supported: register aic_photographs as a distillation-input domain for an E23-style student run; if rejected:
    record the leakage and keep the group evaluation-only'
  status: inconclusive
  result: 'mixed: on the aic_photographs analysis half (306 prints, 111 artists) process p@5 artist-excluded is above chance
    (0.389) for every fixed candidate (hybrid_supcon_family 0.532 [0.453, 0.596]; raw_hybrid 0.519; student_fs_v2 0.505),
    but raw_dino_global and colour_tone16 leak the artist (share 0.22/0.21 vs prior 0.017) and the three real-distilled students
    have a process p@5 lower CI below chance (fs_v2_real 0.446 [0.365, 0.517], l3_real 0.445, kdsdxl 0.468): falsified for
    [''raw_dino_global'', ''colour_tone16'', ''student_style_fs_v2_kdsdxl_64'', ''student_style_fs_v2_real_64'', ''student_style_l3_real_64''].
    Teacher agreement: fs_v2_real 0.55, l3_real 0.41. No promotion; aic_photographs is not registered as a distillation domain
    on this evidence.'
- id: E30_joint_generator_supcon
  hypothesis: a family SupCon projection trained on the union of the filmsynth and sdxl TRAIN families (13 generator-namespaced
    labels) transfers to the held-out generator (zimage) better than the filmsynth-only projection, without more content leakage
    or generator fingerprint
  motivation: 'E28: the family projection is generator-specific whichever layer feeds it (filmsynth-trained 0.467 on filmsynth
    but 0.34 on zimage; sdxl-trained collapses on filmsynth to 0.19). Cross-pipeline training is the obvious next test and
    costs seconds on cached features. Synthetic-only: no promotion can follow; a supported result queues the joint projection
    as a candidate for the real-film evaluations (E27/E27b).'
  value: 3
  gpu_minutes: 1
  gpu_mb: 2500
  cpu_minutes: 3
  disk_gb: 0.01
  datasets:
  - bench_features_v1
  metric: 'scripts/joint_generator_supcon.py: zimage val B (held-out generator) with scene-bootstrap CI, own-source rank-1,
    generator share; summary.supported'
  confounders:
  - sdxl TRAIN has only 4 families
  - zimage shares a LoRA family name with sdxl (filmgrain_lora) but not the pipeline
  - val split only
  falsified_if: 'summary.supported == 0: the joint projection''s zimage B lower CI does not exceed the filmsynth-only point
    estimate, or own-source rank-1 rises by > 0.05, or generator share rises by > 0.02'
  falsify:
    metric: supported
    below: 1
  falsify_sufficient: true
  command:
  - /home/shanmo/misc/filmlook-ml/.venv/bin/python
  - scripts/joint_generator_supcon.py
  result_json: reports/joint_generator_supcon.json
  metrics_of_interest:
    supported:
      path: summary.supported
      kind: proxy
    zimage_gain:
      path: summary.zimage_joint_minus_filmsynth
      kind: synthetic
    filmsynth_change:
