# Claude API research budget and models (owner brief of 2026-11-11: "Use Claude API Credits to Accelerate ML Research").
# Offline research only: annotation, validation, evaluation. Nothing here is called from the website.
budget:
  # Owner briefs of 2026-11-11: $120 of promotional credit, expiring 2026-12-06. No auto-reload, no charge beyond the credit.
  total_usd: 115.0          # hard cap for the whole campaign: the credit minus the $5 contingency, which no code may spend
  pilot_usd: 5.0            # hard cap until `review-pilot` has passed (reports/claude/pilot_review.json)
  expires: "2026-12-06"     # no submission is accepted on or after this date; nothing new is submitted on the last day before it
  buckets:                  # flexible allocations; a submission is refused when its bucket would be exceeded
    film: 45.0              # film-look dataset annotation and analysis (filmset, lutsynth, lutdesc, lutscene)
    photographer: 35.0      # photographer-style dataset annotation (bank)
    quality: 20.0           # second-model checks, difficult examples, agreement samples (any task, tier check)
    advanced: 15.0          # stronger-model review and exploratory experiments
models:
  cheap: claude-haiku-5-5         # bulk annotation
  check: claude-sonnet-5-5        # difficult images and a validation sample
  strong: claude-opus-5-5         # selective review of cases where the two cheaper models disagree
prices_per_mtok:                  # list prices checked 2026-11-11 against the skill's cached table (2026-11-03)
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5: {input: 4.00, output: 20.00}
multipliers: {batch: 0.5, cache_write_5m: 1.25, cache_read: 0.1}
image: {long_edge: 768, jpeg_quality: 85}
effort: low
max_tokens: 3000
est_output_tokens: 700            # planning estimate only; the ledger records what the API reports
authorization:
  basis: >-
    Owner brief 2026-11-11 (structured style annotations of legally usable datasets, evaluation, model improvement);
    configs/labeling.yaml training_authorization.status user_confirmed (2026-11-07, no written reference on file).
  images: public domain or CC0 per file (refdb manifest rights_status = eligible); synthetic LUT renders of CC-BY scenes
  never_sent: user uploads, photographs by in-copyright photographers, file names, titles, photographer names
