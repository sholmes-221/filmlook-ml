[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmlook-ml"
version = "1.0.0"
description = "FilmLook film-aesthetics model: training repo (filmlook_ml) + standalone CPU runtime (filmlook_infer)"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26", "pillow>=10", "pydantic>=2.6", "pyyaml>=6", "imagehash>=4.3",
  "scipy>=1.11", "onnxruntime>=1.18",
]

[project.optional-dependencies]
train = [
  "torch>=2.4", "torchvision>=0.19", "transformers>=4.45", "huggingface_hub>=0.24",
  "scikit-learn>=1.4", "pandas>=2.1", "pyarrow>=15", "tqdm", "onnx>=1.16", "onnxscript",
  "jinja2>=3.1", "requests>=2.31", "python-dotenv>=1.0", "psutil>=5.9",
]
label = ["anthropic>=0.40", "streamlit>=1.35"]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filmlook_infer = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real DINOv2 backbone"]
