# Machine-readable dataset registry. `training_allowed` is the ONLY switch the pipeline
# honours; it is true only when license + commercial + ML-training rights were verified.
license_allowlist:            # licenses acceptable for commercial ML training
  - CC0-1.0
  - PDM-1.0
  - CDLA-Permissive-2.0
  - Apache-2.0
  - CC-BY-4.0
  - CC-BY-2.0
  - Unsplash-Lite-Dataset-Terms   # internal business ML training only, no redistribution
  - user-consent                  # user-owned photos with explicit training consent
  - synthetic                     # procedurally generated in this repo
license_denylist: [CC-BY-SA-2.0, CC-BY-SA-4.0, CC-BY-NC-4.0, CC-BY-NC-2.0, CC-BY-NC-SA-2.0, CC-BY-NC-ND-2.0, CC-BY-NC-SA-4.0, CC-BY-NC-ND-4.0, Unsplash-Full-Dataset-Terms, unknown]

datasets:
  - id: synthetic_fixture
    name: FilmLook synthetic edit-family fixture
    source_url: local (src/filmlook_ml/datasets/synthetic.py)
    license: synthetic
    commercial_use: true
    ml_training: true
    num_images: configurable
    labels: [edit_family, edit_type, known attribute orderings]
    download_method: generated
    attribution: none
    redistribution: unrestricted
    training_allowed: true
    verified_on: 2026-11-06

  - id: pd12m_pilot
    name: PD12M (Spawning) - photographic pilot subset
    source_url: https://huggingface.co/datasets/Spawning/PD12M
    license: CC0-1.0            # per-row license field; dataset card tag CDLA-Permissive-2.0
    commercial_use: true
    ml_training: true           # CC0/PDM waive rights; card states intended for model training
    num_images: 12400094
    labels: [caption (synthetic recaption), width, height, source, license per row]
    download_method: metadata parquet via huggingface_hub; images via per-row URL (rate limited)
    attribution: not required (CC0); we keep source + id in the manifest anyway
    redistribution: permitted (CC0); we do not redistribute
    training_allowed: true
    row_license_filter: [creativecommons.org/publicdomain/zero, creativecommons.org/publicdomain/mark]
    notes: Mostly museum/archive content - filter captions for photographs. Few modern colour photos; few film-stock labels.
    verified_on: 2026-11-06

  - id: unsplash_lite
    name: Unsplash Lite Dataset 1.4.0
    source_url: https://github.com/unsplash/datasets
    license: Unsplash-Lite-Dataset-Terms
    commercial_use: true
    ml_training: true           # TERMS 2.A: internal use to train ML models for internal business purposes
    num_images: 25000
    labels: [keywords, EXIF camera make/model, searches, colors]
    download_method: https://unsplash.com/data/lite/latest (~700MB zip of TSVs) then image URLs
    attribution: requested for research citation ("Unsplash Lite Dataset 1.4.0")
    redistribution: PROHIBITED (TERMS s.3) - never ship images or derived dataset; models stay internal-use
    training_allowed: false     # v1: the target is a PUBLIC Xiaohongshu-facing product; TERMS 2.A only covers
                                #     internal business purposes. Re-enable only after legal review.
    requires_approval_to_download: true   # >500MB
    notes: Not used for v1 (internal-use-only terms vs public product).
    verified_on: 2026-11-06

  - id: unsplash_full
    name: Unsplash Full Dataset
    source_url: https://github.com/unsplash/datasets
    license: Unsplash-Full-Dataset-Terms
    commercial_use: false
    ml_training: false          # models trained on it must not be used commercially
    training_allowed: false
    verified_on: 2026-11-06

  - id: ava
    name: AVA (Aesthetic Visual Analysis)
    source_url: https://github.com/imfing/ava_downloader
    license: unknown
    commercial_use: unknown
    ml_training: unknown
    num_images: 255500
    labels: [aesthetic vote histograms 1-10, semantic tags, challenge ids]
    download_method: Kaggle / HF mirror / MEGA / torrent (third-party mirrors)
    attribution: cite Murray et al. CVPR 2012
    redistribution: unclear - images are dpchallenge.com user uploads
    training_allowed: false     # QUARANTINED: no license grant found; images are third-party copyrighted
    verified_on: 2026-11-06

  - id: flickr_cc_commercial
    name: Flickr Creative Commons (commercial-compatible licenses only)
    source_url: https://www.flickr.com/creativecommons/
    license: per-image (CC-BY-2.0/4.0, CC0-1.0, PDM-1.0 accepted; ND/SA need review; NC rejected)
    commercial_use: per-image
    ml_training: per-image (not addressed by Flickr)
    download_method: Flickr API (requires key, API ToS) - not implemented by default
    attribution: required for CC-BY
    training_allowed: false     # enable per-image after license filtering + attribution tracking
    verified_on: 2026-11-06

  - id: commoncatalog_ccby
    name: CommonCatalog CC-BY (YFCC100M / Flickr photos, re-hosted by common-canvas on Hugging Face)
    source_url: https://huggingface.co/datasets/common-canvas/commoncatalog-cc-by
    license: CC-BY-2.0          # PER-ROW licenseurl is checked; only creativecommons.org/licenses/by/<v>/ accepted
    commercial_use: true
    ml_training: true           # CC-BY permits any use incl. commercial, subject to attribution on redistribution
    num_images: ~15M (we use a few hundred originals)
    labels: [EXIF camera make/model, capture device, user tags, BLIP-2 caption, Flickr page URL, uploader]
    download_method: metadata columns + per-image parquet page range reads via huggingface_hub (no Flickr scraping)
    attribution: required - author (Flickr nickname), page URL and license URL kept per image (ATTRIBUTION.jsonl)
    redistribution: allowed with attribution; we do not redistribute images
    training_allowed: true
    row_license_filter: [creativecommons.org/licenses/by/]
    risks: >-
      Uploader-asserted licenses (some Flickr uploads may not be the uploader's own work); license is as of the
      YFCC100M snapshot (CC licenses are irrevocable for copies obtained under them). BLIP-captioned non-photos
      (screens, drawings, posters) are excluded by caption filter. The HF dataset tag (cc-by-4.0) is NOT relied on.
    verified_on: 2026-11-06

  - id: commoncatalog_ccbysa
    name: CommonCatalog CC-BY-SA
    source_url: https://huggingface.co/datasets/common-canvas/commoncatalog-cc-by-sa
    license: CC-BY-SA-4.0
    training_allowed: false     # share-alike scope for trained models unresolved; not needed
    verified_on: 2026-11-06

  - id: wikimedia_commons_api
    name: Wikimedia Commons via MediaWiki API
    source_url: https://commons.wikimedia.org/w/api.php
    license: per-file
    training_allowed: false     # superseded by commons_film below (evaluation-only); never a training source
    verified_on: 2026-11-06

  - id: commons_film
    name: Wikimedia Commons "Photographs by film brand" tree (stock-labelled real film scans) + DxO FilmPack emulation controls
    source_url: https://commons.wikimedia.org/wiki/Category:Photographs_by_film_brand
    license: per-file           # only CC0 / public domain / CC BY x / CC BY-SA x files are ingested; licence kept per row
    commercial_use: per-file
    ml_training: false          # ShareAlike scope for trained models unresolved; this project does not train on it
    num_images: ~6800 film files in ~170 categories (2026-11-07), plus ~1000 digital-emulation controls
    labels: [film_stock_claim (uploader category), film_type (category tree), scanner_category, camera_category, roll_category (per-uploader roll cats), uploader, EXIF make/model/software when present]
    download_method: >-
      MediaWiki Action API (descriptive User-Agent, requests in series, 0.6 s spacing, maxlag=5, 429 backoff; API:Etiquette)
      for category listing and per-file metadata; <=1024 px server renditions from upload.wikimedia.org. The site
      robots.txt disallows /w/ for generic crawlers; the Action API is the documented programmatic interface and is used
      as its etiquette page prescribes; files are standard-width renditions (never originals, which are rate-limited per client), fetched by the resumable downloader with Retry-After honoured (docs/PIPELINES.md). Owner may veto: delete data/raw/commons_film and this entry.
    attribution: required - author, licence and file page URL per row (data/raw/commons_film/ATTRIBUTION.jsonl)
    redistribution: not done; images stay local
    training_allowed: false     # EVALUATION ONLY (real-film retrieval, scanner/colour-shift analysis); split by uploader into analysis/test
    risks: >-
      Stock labels are uploader-asserted categories (like CommonCatalog tags), not owner records; many stocks are
      dominated by one uploader (photographer confound), so every metric excludes the query's uploader and bootstraps
      over uploaders. Mixed eras, scanners and scan workflows (also an asset for scanner-effect analysis).
    verified_on: 2026-11-07

  - id: openverse_api
    name: Openverse API
    source_url: https://api.openverse.org/v1/images/
    license: per-file
    training_allowed: false     # robots.txt disallows /v1/images/ and explicitly blocks AI crawlers; not used
    verified_on: 2026-11-06

  - id: user_consented
    name: FilmLook user uploads with explicit training consent
    source_url: FilmLook application (export pending)
    license: user-consent
    commercial_use: true
    ml_training: true
    labels: [optional user-declared film stock / camera / edit]
    download_method: manual export into data/raw/user_consented/ with consent.jsonl
    training_allowed: true
    verified_on: null

  - id: commoncatalog_film
    name: CommonCatalog CC-BY film scans with uploader film-stock tags (evaluation-only real film, class B)
    source_url: https://huggingface.co/datasets/common-canvas/commoncatalog-cc-by
    license: CC-BY-2.0          # per-row licenseurl checked (creativecommons.org/licenses/by/<v>/ only); the HF tag is not relied on
    commercial_use: true
    ml_training: false          # project policy: evaluation-only snapshot (independent of the students' distillation inputs)
    num_images: "pilot target 300-1,500 (caps 20 per uploader, 6 per uploader x stock, 150 per stock)"
    labels: [film_stock (uploader tag, canonicalised by filmlook_ml.datasets.film_stock), film_brand, film_type, scanner EXIF (capture device), uploader, caption]
    download_method: metadata-only parquet scans + per-image parquet page-range reads via huggingface_hub (scripts/ingest_commoncatalog_film.py; no Flickr scraping); resumable, sha256 + phash, atomic writes
    attribution: required - author, page URL and licence URL per image (data/raw/commoncatalog_film/ATTRIBUTION.jsonl)
    redistribution: allowed with attribution; images stay local
    training_allowed: false     # EVALUATION ONLY; uploaders present in the training manifest are excluded; split by uploader hash (analysis/test)
    authenticity_class: B       # scanner EXIF + uploader claim; never verified from pixels
    risks: >-
      Stock labels are uploader-asserted tags (noisy, sometimes a brand only -> film_stock null, never a negative label);
      uploader-asserted licences as for commoncatalog_ccby; scanner families and uploaders are confounds (every metric
      excludes the query's uploader and bootstraps over uploaders).
    verified_on: 2026-11-07

  - id: commoncatalog_film_hd
    name: CommonCatalog CC-BY film scans, second independent snapshot (session-7 fresh holdout; 2048-4096 px shards, new uploaders only)
    source_url: https://huggingface.co/datasets/common-canvas/commoncatalog-cc-by
    license: CC-BY-2.0          # per-row licenseurl checked as for commoncatalog_film
    commercial_use: true
    ml_training: false
    num_images: "scan-limited (caps 30 per uploader, 10 per uploader x stock, 150 per stock); uploaders of commoncatalog_film (both halves) and of the training manifest excluded"
    labels: [film_stock (uploader tag), film_brand, film_type, scanner EXIF, uploader, caption]
    download_method: same adapter as commoncatalog_film with --dataset-id commoncatalog_film_hd (scripts/ingest_commoncatalog_film.py)
    attribution: required - author, page URL and licence URL per image (data/raw/commoncatalog_film_hd/ATTRIBUTION.jsonl)
    redistribution: allowed with attribution; images stay local
    training_allowed: false     # HELD-OUT EVALUATION ONLY: read once by the pre-registered E53; never used for selection
    authenticity_class: B
    risks: as commoncatalog_film; smaller than the first snapshot (the 2048-4096 px shards yield about two qualifying rows each)
    verified_on: 2026-11-08

  - id: met_photographs
    name: The Met public-domain photographs (session-7 fresh museum holdout, CC0)
    source_url: https://metmuseum.github.io/
    license: CC0-1.0            # The Met Open Access: public-domain works (Is Public Domain = true in MetObjects.csv, re-checked per object via the API)
    commercial_use: true
    ml_training: true           # CC0 would permit it; project policy below forbids it for this set
    num_images: target 700 of 7,029 candidates (department Photographs, classification Photographs, medium recorded; cap 6 per artist)
    labels: [artist, date, medium/process (albumen, salted paper, daguerreotype, cyanotype, gelatin silver ...), classification, credit line]
    download_method: MetObjects.csv (open-access release) for the listing; objects endpoint per selected work (no key, one request per 0.6 s, Retry-After honoured); primaryImageSmall renditions via research.downloader (scripts/ingest_met_photographs.py)
    attribution: not required (CC0); artist, title and page URL kept per image anyway
    redistribution: permitted (CC0); not done
    training_allowed: false     # HELD-OUT EVALUATION ONLY (session-7 policy; the licence is not the reason)
    authenticity_class: A       # museum records of the physical print; digitised prints; 1840s-1890s dominate
    risks: 19th-century processes only (albumen and salted paper dominate); period and subject confounds as for aic_photographs; museum digitisation is a shared nuisance
    verified_on: 2026-11-08

  - id: artefact_film
    name: ARTeFACT authentically damaged & manually restored 35mm scans (Ivanova et al., Eurographics 2023)
    source_url: https://figshare.com/articles/dataset/Authentically_damaged_film_scans/21803304
    license: CC-BY-4.0          # figshare licence record checked by the adapter at every run (refuses if it changes)
    commercial_use: true
    ml_training: false          # project policy: evaluation-only (authenticity and per-emulsion sanity checks)
    num_images: 88 (44 damaged originals + 44 restored counterparts), 11 emulsions, one photographer
    labels: [film_stock (owner record in file name and paper), film_format (35mm / half-frame), restored flag, figshare md5]
    download_method: figshare API file URLs via research.downloader (scripts/ingest_artefact_film.py); original bytes kept, md5 + sha256 verified
    attribution: required - Daniela Ivanova, doi 10.6084/m9.figshare.21803304 (data/raw/artefact_film/ATTRIBUTION.jsonl)
    redistribution: not done
    training_allowed: false
    authenticity_class: A
    risks: single photographer and scanner (within-photographer only); scans carry dust/scratch damage by design (restored versions are derived images, kept separate by kind)
    verified_on: 2026-11-07

  - id: aic_photographs
    name: Art Institute of Chicago public-domain photographs (curated-photography group, CC0)
    source_url: https://api.artic.edu/docs/
    license: CC0-1.0            # AIC Open Access: public-domain works' images are CC0 (is_public_domain = true checked per record)
    commercial_use: true
    ml_training: true
    num_images: pilot target 600 of 3,777 (cap 8 per artist)
    labels: [artist, date, medium/process (gelatin silver print, albumen print, ...), classification, credit line]
    download_method: public API (metadata, paged, 1.2 s spacing, descriptive AIC-User-Agent) + IIIF 843 px renditions via research.downloader (scripts/ingest_aic_photographs.py)
    attribution: not required (CC0); artist, title and page URL kept per image anyway
    redistribution: permitted (CC0); not done
    training_allowed: true      # CC0; group curated_photography (never mixed into the real-film pool or synthetic sets without an explicit experiment definition)
    authenticity_class: A       # museum records of the physical print; digitised prints, not negatives; mostly 1840s-1920s
    risks: historic processes only (no modern editorial photography); museum digitisation pipeline is a shared nuisance; editorial/curatorial selection is not a quality ground truth
    verified_on: 2026-11-07

  - id: photographer_refdb
    name: Photographer reference database (public-domain and CC0 photographs by named historical photographers)
    source_url: https://commons.wikimedia.org/ (Category:Photographs by <photographer>) and https://api.artic.edu/ (is_public_domain)
    license: PDM-1.0            # per record: Commons public-domain templates (PD-USGov-FSA, PD-old-70, PD-US-expired ...) or CC0 (AIC / Commons CC0); data/refdb/manifest.sqlite rights_class
    commercial_use: true
    ml_training: true
    num_images: pilot cap 300 per photographer, 14 photographers (FSA/OWI photographers, Hine, Atget, Stieglitz, Käsebier, Clarence H. White)
    labels: [photographer (source attribution), title, year, source series/category, licence + evidence URL]
    download_method: Commons API categorymembers + imageinfo (one request at a time, maxlag, Retry-After); scaled renditions (1024 px Commons thumbnails, AIC IIIF 843 px) via research.downloader (scripts/refdb_discover.py, scripts/refdb_download.py)
    attribution: kept per record (artist text, credit line, source page)
    redistribution: not done; only embeddings and metadata may ship
    training_allowed: true      # owner's brief of 2026-11-09: lightweight photographer classifier trained only on legally usable images; no model-generated labels
    authenticity_class: A
    risks: attribution comes from the source record (Commons community / museum); several scans of one negative (phash dedup); FSA subject matter shared across photographers (intended as a subject-bias control); Library of Congress itself refused scripted access (Cloudflare challenge) so LoC scans arrive only via Commons copies
    verified_on: 2026-11-09
